<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420">
  <title>GUTA Música</title>
  <desc>Logotipo vectorial con símbolo musical coral y turquesa, y texto GUTA Música en color marfil.</desc>
  <defs>
    <style>
      .coral{fill:#FF493F}
      .cyan{fill:#00D7D8}
      .cream{fill:#FFF4E5}
    </style>
  </defs>
  <!-- Geometric G mark -->
  <path class="coral" fill-rule="evenodd" d="
    M 345,56
    A 162,162 0 1 0 507,218
    L 507,218 L 507,260 L 424,260
    A 80,80 0 1 1 371,103
    L 424,49
    A 160,160 0 0 0 345,56 Z
    M 345,137
    A 81,81 0 1 0 426,218
    L 345,218 Z" opacity="0"/>
  <!-- Clean bold circular G, deliberately simplified for small-size legibility -->
  <path class="coral" d="M350 48
    C258 48 184 122 184 214
    C184 306 258 380 350 380
    C442 380 508 319 508 230
    L508 203 L371 203 L371 258 L440 258
    C424 298 391 324 350 324
    C289 324 240 275 240 214
    C240 153 289 104 350 104
    C377 104 400 113 420 130
    L459 88
    C429 63 391 48 350 48 Z"/>
  <!-- Music note integrated into the G -->
  <path fill="#06102D" d="M331 228 H420 V274 H377 V295
    C377 322 355 342 328 342 C305 342 286 325 286 303
    C286 279 305 261 329 261 C330 261 331 261 331 262 Z"/>
  <circle class="coral" cx="326" cy="303" r="29"/>
  <!-- Equalizer bars -->
  <rect class="cyan" x="437" y="82" width="24" height="78" rx="12"/>
  <rect class="cyan" x="472" y="50" width="25" height="112" rx="12.5"/>
  <rect class="cyan" x="508" y="75" width="24" height="86" rx="12"/>
  <!-- Wordmark -->
  <text x="565" y="235" class="cream" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="800" letter-spacing="2">GUTA</text>
  <text x="584" y="305" class="cream" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="400" letter-spacing="19">MÚSICA</text>
</svg>